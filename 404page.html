<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Signal Lost | SpaceNet</title>


    <link
        href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Inter:wght@400;600;800&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --bg-dark: #020610;
            --cyan-blue: #00d2ff;
            --neon-green: #0ef174;
            --text-light: #ffffff;
            --text-gray: #a0aec0;
            --font-title: 'Orbitron', sans-serif;
            --font-text: 'Inter', sans-serif;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: var(--font-text);
            overflow: hidden;
            background-color: var(--bg-dark);
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }


        .error-bg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;

            background-image: url('https://images.unsplash.com/photo-1462331940025-496dfbfc7564?q=80&w=1920&auto=format&fit=crop');
            background-size: cover;
            background-position: center;
            filter: blur(6px);
            transform: scale(1.05);
            z-index: 1;
        }


        .error-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at center, rgba(2, 6, 16, 0.6) 0%, rgba(2, 6, 16, 0.95) 100%);
            z-index: 2;
        }


        .error-content {
            position: relative;
            z-index: 10;
            text-align: center;
            color: var(--text-light);
            padding: 60px 50px;
            width: 100%;
            max-width: 650px;
            background: rgba(4, 11, 23, 0.6);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(0, 210, 255, 0.2);
            border-radius: 24px;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.8), inset 0 0 20px rgba(0, 210, 255, 0.1);
            transform: translateY(30px) scale(0.95);
            opacity: 0;
            animation: fadeUp 1s cubic-bezier(0.25, 1, 0.5, 1) forwards 0.3s;
        }

        @keyframes fadeUp {
            to {
                transform: translateY(0) scale(1);
                opacity: 1;
            }
        }

        .error-badge {
            display: inline-block;
            background: rgba(255, 51, 102, 0.1);
            color: #ff3366;
            padding: 8px 20px;
            border-radius: 30px;
            font-family: 'Courier New', Courier, monospace;
            font-size: 0.9rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 25px;
            border: 1px solid rgba(255, 51, 102, 0.3);
            box-shadow: 0 0 15px rgba(255, 51, 102, 0.2);
        }

        .error-badge i {
            margin-right: 8px;
        }


        .error-content h1 {
            font-family: var(--font-title);
            font-size: 8rem;
            font-weight: 900;
            background: linear-gradient(135deg, var(--cyan-blue), var(--neon-green));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 10px;
            line-height: 1;
            text-shadow: 0 10px 40px rgba(0, 210, 255, 0.4);
        }

        .error-content h2 {
            font-family: var(--font-title);
            font-size: 2rem;
            margin-bottom: 20px;
            font-weight: 800;
            color: #ffffff;
        }

        .error-content p {
            font-size: 1.15rem;
            color: var(--text-gray);
            margin-bottom: 40px;
            line-height: 1.7;
        }


        .error-buttons {
            display: flex;
            justify-content: center;
            gap: 20px;
        }

        .btn-primary,
        .btn-secondary {
            padding: 16px 32px;
            font-size: 1.05rem;
            font-weight: 700;
            border-radius: 50px;
            text-decoration: none;
            cursor: pointer;
            transition: all 0.4s ease;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            font-family: var(--font-title);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .btn-primary {
            background: var(--neon-green);
            color: var(--bg-dark);
            border: 2px solid var(--neon-green);
            box-shadow: 0 10px 25px rgba(14, 241, 116, 0.3);
        }

        .btn-primary:hover {
            background: transparent;
            color: var(--neon-green);
            box-shadow: 0 10px 30px rgba(14, 241, 116, 0.6), inset 0 0 15px rgba(14, 241, 116, 0.3);
            transform: translateY(-3px);
        }

        .btn-secondary {
            background: rgba(0, 210, 255, 0.1);
            color: var(--cyan-blue);
            border: 2px solid rgba(0, 210, 255, 0.5);
        }

        .btn-secondary:hover {
            background: rgba(0, 210, 255, 0.2);
            color: #ffffff;
            border-color: var(--cyan-blue);
            box-shadow: 0 10px 25px rgba(0, 210, 255, 0.4);
            transform: translateY(-3px);
        }


        .falling-space-objects {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 5;
            overflow: hidden;
        }

        .falling-icon {
            position: absolute;
            top: -10vh;
            animation: fallAndRotate linear infinite;
        }

        @keyframes fallAndRotate {
            0% {
                transform: translateY(-10vh) rotate(0deg);
                opacity: 0;
            }

            10% {
                opacity: 0.6;
            }

            90% {
                opacity: 0.6;
            }

            100% {
                transform: translateY(110vh) rotate(360deg);
                opacity: 0;
            }
        }


        @media (max-width: 768px) {
            .error-content {
                margin: 20px;
                padding: 40px 25px;
            }

            .error-content h1 {
                font-size: 5.5rem;
            }

            .error-content h2 {
                font-size: 1.5rem;
            }

            .error-content p {
                font-size: 1rem;
                margin-bottom: 30px;
            }

            .error-buttons {
                flex-direction: column;
                gap: 15px;
                width: 100%;
                max-width: 300px;
                margin: 0 auto;
            }

            .btn-primary,
            .btn-secondary {
                width: 100%;
            }
        }
    </style>
</head>

<body>


    <div class="falling-space-objects" id="spaceContainer"></div>


    <div class="error-bg"></div>
    <div class="error-overlay"></div>


    <div class="error-content">

        <div class="error-badge">
            <i class="fa-solid fa-triangle-exclamation"></i> Sector Not Found
        </div>

        <h1 class="glitch-text">404</h1>

        <h2>Lost in the Void...</h2>

        <p>The coordinates you entered lead to a black hole. The page or mission you are looking for does not exist in
            our current network.</p>

        <div class="error-buttons">
            <button onclick="history.back()" class="btn-secondary">
                <i class="fa-solid fa-arrow-left"></i> Abort Mission
            </button>

            <a href="index.html" class="btn-primary">
                Return to Base <i class="fa-solid fa-house-chimney"></i>
            </a>
        </div>

    </div>


    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const container = document.getElementById("spaceContainer");


            const icons = [
                'fa-satellite',
                'fa-rocket',
                'fa-meteor',
                'fa-user-astronaut',
                'fa-star',
                'fa-moon'
            ];


            const colors = ['#00d2ff', '#0ef174', '#ffffff', '#cbd5e1', '#64748b'];

            function createFallingSpaceObject() {
                const iconEl = document.createElement("i");

                const randomIcon = icons[Math.floor(Math.random() * icons.length)];
                const randomColor = colors[Math.floor(Math.random() * colors.length)];

                iconEl.className = `fa-solid ${randomIcon} falling-icon`;

                iconEl.style.left = Math.random() * 100 + "vw";
                iconEl.style.color = randomColor;

                iconEl.style.filter = `drop-shadow(0 5px 15px ${randomColor}90)`;


                const duration = Math.random() * 10 + 8;
                iconEl.style.animationDuration = duration + "s";


                const size = Math.random() * 1.5 + 1.0;
                iconEl.style.fontSize = size + "rem";

                container.appendChild(iconEl);

                setTimeout(() => {
                    iconEl.remove();
                }, duration * 1000);
            }

            setInterval(createFallingSpaceObject, 400);
        });
    </script>
</body>

</html>
